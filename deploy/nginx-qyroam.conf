server {
    listen 80;
    listen [::]:80;
    server_name qyroam.com www.qyroam.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://qyroam.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qyroam.com;

    # Certbot can populate these paths during TLS provisioning.
    ssl_certificate /etc/letsencrypt/live/qyroam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qyroam.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qyroam.com;

    ssl_certificate /etc/letsencrypt/live/qyroam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qyroam.com/privkey.pem;

    return 301 https://qyroam.com$request_uri;
}
