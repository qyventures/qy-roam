# Never persist query strings in the production access log. Customer
# confirmation URLs carry a Stripe Checkout Session id as a capability, while
# sales-page URLs can contain campaign attribution. `$uri` retains the route
# needed for status/latency monitoring without the arguments included by
# Nginx's default `$request` field.
log_format qyroam_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           'request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name qyroam.com www.qyroam.com;
    access_log /var/log/nginx/qyroam.access.log qyroam_no_query;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://qyroam.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qyroam.com;
    access_log /var/log/nginx/qyroam.access.log qyroam_no_query;

    # Certbot can populate these paths during TLS provisioning.
    ssl_certificate /etc/letsencrypt/live/qyroam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qyroam.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Keep transport pinning at the TLS edge as well as in Next.js. This also
    # covers Nginx-generated errors that never reach the application.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The application also enforces bounded request readers, but reject an
    # oversized or stalled upload at the public edge before it can occupy a
    # proxy connection or a Node worker. One megabyte is deliberately aligned
    # with Stripe's signed webhook boundary and remains ample for every
    # supported JSON checkout/admin request (which have tighter app limits).
    client_max_body_size 1m;
    client_body_timeout 15s;
    # Bound the part of a slow-client request that happens before a body is
    # available to the route-level readers. Nginx's much longer default header
    # timeout would otherwise let an incomplete request occupy an ingress
    # connection without reaching any of the application's admission guards.
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # QY Roam has no React/Next Server Actions. Do not expose the unsupported
    # framework action parser to public traffic: the maintained Next.js lines
    # receive security fixes here, while this application is intentionally
    # still completing its separately tested framework migration. A plain
    # return is safe in Nginx rewrite context and runs before proxying a body.
    if ($http_next_action != "") {
        return 403;
    }

    # Nginx's client_body_timeout is an inactivity timeout, not an absolute
    # upload deadline. With request buffering, a peer can keep an upload alive
    # indefinitely by dripping bytes just inside that interval, and the
    # request will never reach the application's absolute body deadlines.
    # Every QY Roam JSON mutation uses a bounded stream reader; pass request
    # bodies through so its byte, chunk and wall-clock limits remain
    # authoritative for checkout, admin operations and Stripe webhooks.
    location ~ ^/api/(stripe/webhook|stripe-webhook)$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # QY Roam has no WebSocket endpoint. Advertising an upgrade on every
        # webhook prevents ordinary upstream HTTP semantics and can make
        # Stripe POSTs take the protocol-upgrade path in Node. Keep this as a
        # this a plain HTTP/1.1 connection instead.
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        # This application treats proxy-supplied client provenance as a
        # security boundary for checkout throttling and consented Meta CAPI
        # matching. Never append an inbound forwarding chain here: a caller
        # can supply X-Forwarded-For directly, and a later consumer could
        # otherwise mistake that spoofed first hop for the traveller. The
        # standalone server is loopback-only, so Nginx's socket peer is the
        # only trusted client address at this boundary.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # The standalone application does not expose WebSockets. Keep checkout,
        # confirmation, admin and static requests on the ordinary HTTP path
        # instead of forcing each one through an upgrade handshake.
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        # A paid-order webhook can legitimately spend up to one bounded Stripe
        # retrieval/retry window, a bounded Supabase persistence retry, and
        # the independent SMTP/Meta delivery attempts.  Sixty seconds can
        # therefore cut off a healthy worker just before it settles its
        # idempotency lease, causing an unnecessary Stripe retry.  Keep the
        # proxy deadline comfortably above that finite application budget;
        # request/body limits above and the application-level dependency
        # deadlines still protect the service from a stalled peer.
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qyroam.com;
    access_log /var/log/nginx/qyroam.access.log qyroam_no_query;

    ssl_certificate /etc/letsencrypt/live/qyroam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qyroam.com/privkey.pem;

    # This redirect is generated entirely by Nginx, so application headers do
    # not apply. Preserve the browser boundary on the legacy TLS hostname.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    return 301 https://qyroam.com$request_uri;
}
